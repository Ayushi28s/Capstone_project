global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "commerceops-backend"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
    metrics_path: /metrics

  - job_name: "commerceops-worker"
    static_configs:
      - targets:
          - "host.docker.internal:9100"
    metrics_path: /metrics