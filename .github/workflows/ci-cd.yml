name: CommerceOps AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.REGISTRY }}/commerceops-backend
  IMAGE_FRONTEND: ${{ secrets.REGISTRY }}/commerceops-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (compileall)
        working-directory: backend
        run: python -m compileall app mcp_servers scripts tests -q

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/test_nodes.py tests/test_guardrails.py -v

      - name: Offline pipeline wiring validation
        working-directory: backend
        run: python tests/validate_offline.py

      # Gate: a RAGAS faithfulness or guardrail-suite regression fails
      # the build automatically, per the capstone brief's requirement
      # that the red-team suite is a standing CI regression check, not
      # a one-time test.
      - name: RAGAS faithfulness gate (requires OPENROUTER_API_KEY secret)
        if: ${{ secrets.OPENROUTER_API_KEY != '' }}
        working-directory: backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/seed_db.py
          python scripts/run_ragas_eval.py --fail-under 0.90

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: commerceops-backend
          image: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: commerceops-frontend
          image: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Smoke test deployed backend
        run: |
          sleep 10
          curl -f "${{ secrets.BACKEND_URL }}/health" || exit 1
