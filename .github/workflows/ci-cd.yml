name: CommerceOps AI CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_USERNAME }}/commerceops-backend
  IMAGE_FRONTEND: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_USERNAME }}/commerceops-frontend

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend Python files
        working-directory: backend
        run: |
          python -m compileall app mcp_servers scripts -q

      - name: Validate important imports
        working-directory: backend
        run: |
          python -c "import app.main"
          python -c "import app.worker"
          python -c "import app.agents.support_crew"
          python -c "import app.agents.knowledge_agent"
          python -c "import app.agents.merchandising_agent"
          python -c "import app.agents.market_intel_agent"

      - name: Run RAGAS evaluation
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        working-directory: backend
        run: |
          python scripts/seed_db.py
          python scripts/run_ragas_eval.py --fail-under 0.90

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        id: deploy_backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: commerceops-backend
          image: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy frontend to Cloud Run
        id: deploy_frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: commerceops-frontend
          image: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Show deployed URLs
        run: |
          echo "Backend URL: ${{ steps.deploy_backend.outputs.url }}"
          echo "Frontend URL: ${{ steps.deploy_frontend.outputs.url }}"

      - name: Smoke test deployed backend
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 \
            "${{ steps.deploy_backend.outputs.url }}/health"

      - name: Smoke test deployed frontend
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 \
            "${{ steps.deploy_frontend.outputs.url }}"